version: 2
updates:
  # Bump @kolang/* and @codemirror/* npm deps when they publish to npm
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    allow:
      - dependency-name: "@kolang/*"
      - dependency-name: "@codemirror/*"
      - dependency-name: "@tauri-apps/api"
      - dependency-name: "@tauri-apps/cli"
    commit-message:
      prefix: "deps:"
    open-pull-requests-limit: 5