name: Release
on:
  push:
    tags: ['v*']

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: '--target aarch64-apple-darwin'
          - platform: macos-latest
            args: '--target x86_64-apple-darwin'
          - platform: ubuntu-22.04
            args: ''
          - platform: windows-latest
            args: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v5
      # Check out sibling repos so the @kolang/* file: deps resolve.
      - uses: actions/checkout@v5
        with:
          repository: faralidev/kolang-grammar
          path: kolang-grammar
      - uses: actions/checkout@v5
        with:
          repository: faralidev/kolang-wasm
          path: kolang-wasm
      - uses: actions/checkout@v5
        with:
          repository: faralidev/kolang-data
          path: kolang-data
      - name: "Place sibling repos where file: deps expect them"
        shell: bash
        run: |
          # package.json uses file:../kolang-grammar and file:../kolang-wasm (sibling
          # repos); build.cjs resolves ../kolang-data/kolang-docs.json. actions/checkout
          # can't write outside the workspace, so check them out into subdirs and link
          # them one level up so the file: paths resolve.
          # On Windows, ln -s doesn't work in Git Bash — use cmd //c mklink /J (junction).
          if [ "$RUNNER_OS" = "Windows" ]; then
            cmd //c mklink /J "$GITHUB_WORKSPACE\\..\\kolang-grammar" "$GITHUB_WORKSPACE\\kolang-grammar"
            cmd //c mklink /J "$GITHUB_WORKSPACE\\..\\kolang-wasm" "$GITHUB_WORKSPACE\\kolang-wasm"
            cmd //c mklink /J "$GITHUB_WORKSPACE\\..\\kolang-data" "$GITHUB_WORKSPACE\\kolang-data"
          else
            ln -s "$GITHUB_WORKSPACE/kolang-grammar" "$GITHUB_WORKSPACE/../kolang-grammar"
            ln -s "$GITHUB_WORKSPACE/kolang-wasm" "$GITHUB_WORKSPACE/../kolang-wasm"
            ln -s "$GITHUB_WORKSPACE/kolang-data" "$GITHUB_WORKSPACE/../kolang-data"
          fi
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - name: Install dependencies (ubuntu)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Install JS dependencies
        run: npm install
      - name: Build renderer
        run: node build.cjs
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'kolang-ide ${{ github.ref_name }}'
          releaseBody: 'ویرایشگر دسکتاپ کلنگ'
          releaseDraft: false
          args: ${{ matrix.args }}

  bump-taps:
    name: Bump Homebrew cask + Scoop manifest
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Compute SHA256 for release assets
        id: hashes
        run: |
          set -euo pipefail
          VERSION="${{ github.ref_name }}"
          HB_VERSION="${VERSION#v}"
          mkdir -p /tmp/assets
          # kolang-ide publishes:
          #   kolang-ide-{version}-universal.dmg        (macOS — Homebrew cask)
          #   kolang-ide.Setup.{version}.exe            (Windows — Scoop manifest)
          for asset in \
            "kolang-ide-${HB_VERSION}-universal.dmg" \
            "kolang-ide.Setup.${HB_VERSION}.exe"; do
            for attempt in 1 2 3 4 5; do
              if curl -fsSL -o "/tmp/assets/$asset" "https://github.com/faralidev/kolang-ide/releases/download/${VERSION}/$asset"; then
                break
              fi
              echo "attempt $attempt failed, waiting 15s..." >&2
              sleep 15
            done
            test -s "/tmp/assets/$asset"
            HASHES[$asset]=$(sha256sum "/tmp/assets/$asset" | awk '{print $1}')
          done
          {
            echo "version=${VERSION}"
            echo "hb_version=${HB_VERSION}"
            echo "dmg_hash=${HASHES[kolang-ide-${HB_VERSION}-universal.dmg]}"
            echo "exe_hash=${HASHES[kolang-ide.Setup.${HB_VERSION}.exe]}"
          } >> "$GITHUB_OUTPUT"

      # ── Homebrew cask (macOS dmg) ──────────────────────────────────────
      - name: Checkout homebrew-tap
        uses: actions/checkout@v5
        with:
          repository: faralidev/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap

      - name: Update Casks/kolang-ide.rb
        env:
          VERSION: ${{ github.ref_name }}
          HB_VERSION: ${{ steps.hashes.outputs.hb_version }}
          DMG_HASH: ${{ steps.hashes.outputs.dmg_hash }}
        run: |
          python3 - <<'PY'
          import os, re
          version = os.environ["VERSION"]
          hb_version = os.environ["HB_VERSION"]
          dmg_hash = os.environ["DMG_HASH"]
          path = "homebrew-tap/Casks/kolang-ide.rb"

          with open(path, encoding="utf-8") as f:
              content = f.read()

          # Bump version (no leading "v")
          content = re.sub(
              r'^(\s*version\s+")[^"]*(")',
              lambda m: m.group(1) + hb_version + m.group(2),
              content, flags=re.M,
          )
          # Bump sha256
          content = re.sub(
              r'^(\s*sha256\s+")[^"]*(")',
              lambda m: m.group(1) + dmg_hash + m.group(2),
              content, flags=re.M,
          )
          # The url uses #{version} interpolation, so no URL change needed —
          # it auto-resolves to the new version. Just ensure the tag is right.
          # (The url pattern is: .../download/v#{version}/kolang-ide-#{version}-universal.dmg)

          with open(path, "w", encoding="utf-8") as f:
              f.write(content)
          print(f"Updated {path}: version={hb_version}")
          PY

      - name: Create Homebrew PR
        uses: peter-evans/create-pull-request@v6
        with:
          path: homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          branch: kolang-ide-${{ github.ref_name }}
          title: "kolang-ide ${{ github.ref_name }}"
          commit-message: "kolang-ide ${{ github.ref_name }}: bump version + sha256"
          body: |
            Bump kolang-ide to ${{ github.ref_name }} and update the dmg SHA256.

            Automated by the kolang-ide release workflow.

      # ── Scoop manifest (Windows exe) ───────────────────────────────────
      - name: Checkout scoop-bucket
        uses: actions/checkout@v5
        with:
          repository: faralidev/scoop-bucket
          token: ${{ secrets.SCOOP_BUCKET_TOKEN }}
          path: scoop-bucket

      - name: Update bucket/kolang-ide.json
        env:
          VERSION: ${{ github.ref_name }}
          HB_VERSION: ${{ steps.hashes.outputs.hb_version }}
          EXE_HASH: ${{ steps.hashes.outputs.exe_hash }}
        run: |
          python3 - <<'PY'
          import json, os, re
          version = os.environ["VERSION"]
          hb_version = os.environ["HB_VERSION"]
          exe_hash = os.environ["EXE_HASH"]
          path = "scoop-bucket/bucket/kolang-ide.json"

          with open(path, encoding="utf-8") as f:
              data = json.load(f)

          data["version"] = hb_version
          arch = data["architecture"]["64bit"]
          arch["hash"] = exe_hash
          arch["url"] = re.sub(r"/download/v[^/]+/", f"/download/{version}/", arch["url"])

          with open(path, "w", encoding="utf-8") as f:
              json.dump(data, f, indent=4, ensure_ascii=False)
              f.write("\n")
          print(f"Updated {path}: version={hb_version}")
          PY

      - name: Create Scoop PR
        uses: peter-evans/create-pull-request@v6
        with:
          path: scoop-bucket
          token: ${{ secrets.SCOOP_BUCKET_TOKEN }}
          branch: kolang-ide-${{ github.ref_name }}
          title: "kolang-ide ${{ github.ref_name }}"
          commit-message: "kolang-ide ${{ github.ref_name }}: bump version + hash"
          body: |
            Bump kolang-ide to ${{ github.ref_name }} and update the Scoop manifest hash.

            Automated by the kolang-ide release workflow.