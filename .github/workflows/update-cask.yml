name: Update Homebrew Cask

# When a kolang-ide release is published, open a PR against
# faralidev/homebrew-tap bumping Casks/kolang-ide.rb to the new version
# (version + dmg sha256). Keeps `brew install --cask faralidev/tap/kolang-ide`
# in sync with releases automatically.
#
# Requires a PAT with `contents:write` + `pull-requests:write` on
# faralidev/homebrew-tap, stored as the `TAP_PAT` secret in this repo.
# (The default GITHUB_TOKEN can't cross-push to another repo.)
#
# Setup:
#   1. Create a fine-grained PAT at
#      https://github.com/settings/personal-access-tokens/new
#      - Repository access: only `faralidev/homebrew-tap`
#      - Permissions: Contents = Read and write, Pull requests = Read and write
#   2. Add it as a secret named `TAP_PAT` in
#      https://github.com/faralidev/kolang-ide/settings/secrets/actions

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to bump the cask to (e.g. v0.2.0)"
        required: true

permissions:
  contents: read

jobs:
  bump-cask:
    runs-on: ubuntu-latest
    if: github.repository == 'faralidev/kolang-ide'
    steps:
      - name: Resolve release tag
        id: rel
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${{ github.event.release.tag_name }}"
          fi
          # Strip a leading 'v' to get the bare version (v0.2.0 -> 0.2.0)
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Resolved: tag=$TAG version=$VERSION"

      - name: Download the universal macOS dmg and compute sha256
        id: sha
        run: |
          set -e
          URL="https://github.com/faralidev/kolang-ide/releases/download/${{ steps.rel.outputs.tag }}/kolang-ide-${{ steps.rel.outputs.version }}-universal.dmg"
          echo "Downloading $URL"
          curl -fL -o kolang.dmg "$URL"
          SHA=$(shasum -a 256 kolang.dmg | awk '{print $1}')
          echo "sha256=$SHA" >> "$GITHUB_OUTPUT"
          echo "Computed sha256: $SHA"

      - name: Check out kolang-ide (for the cask template)
        uses: actions/checkout@v4
        with:
          path: ide

      - name: Check out homebrew-tap
        uses: actions/checkout@v4
        with:
          repository: faralidev/homebrew-tap
          token: ${{ secrets.TAP_PAT }}
          ref: main
          path: tap

      - name: Render Casks/kolang-ide.rb from template
        run: |
          set -e
          VERSION="${{ steps.rel.outputs.version }}"
          SHA="${{ steps.sha.outputs.sha256 }}"
          TEMPLATE="ide/.github/cask-template.rb"
          TARGET="tap/Casks/kolang-ide.rb"
          mkdir -p "$(dirname "$TARGET")"
          # Substitute the two placeholders. Using | as sed delimiter since
          # neither placeholder contains a pipe.
          sed -e "s|__VERSION__|${VERSION}|g" \
              -e "s|__SHA256__|${SHA}|g" \
              "$TEMPLATE" > "$TARGET"
          echo "=== Rendered cask ==="
          cat "$TARGET"

      - name: Commit and push bump branch
        working-directory: tap
        run: |
          set -e
          VERSION="${{ steps.rel.outputs.version }}"
          BRANCH="bump-kolang-ide-${VERSION}"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add Casks/kolang-ide.rb
          git commit -m "cask kolang-ide: bump to ${VERSION}"
          git push --force-with-lease origin "$BRANCH"

      - name: Open or update PR
        env:
          GH_TOKEN: ${{ secrets.TAP_PAT }}
        run: |
          set -e
          VERSION="${{ steps.rel.outputs.version }}"
          BRANCH="bump-kolang-ide-${VERSION}"
          BODY="Bumps \`Casks/kolang-ide.rb\` to \`kolang-ide\` v${VERSION}, triggered by the [release](https://github.com/faralidev/kolang-ide/releases/tag/v${VERSION}).

          - **sha256** recomputed from the published \`kolang-ide-${VERSION}-universal.dmg\`
          - **url** points at the universal macOS dmg (arm64 + x64)

          Generated by \`.github/workflows/update-cask.yml\` in \`faralidev/kolang-ide\`."

          # If a PR already exists for this branch (re-runs), leave it; else create.
          PR_NUMBER=$(gh pr view --repo faralidev/homebrew-tap "$BRANCH" --json number --jq '.number' 2>/dev/null || true)
          if [ -z "$PR_NUMBER" ]; then
            gh pr create --repo faralidev/homebrew-tap \
              --base main --head "$BRANCH" \
              --title "cask kolang-ide: bump to ${VERSION}" \
              --body "$BODY"
          else
            echo "PR #$PR_NUMBER already open — branch force-pushed with updated cask."
          fi
