name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
      - run: node build.cjs
      - name: Verify bundle
        run: node --check dist/bundle.js
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cargo check
        working-directory: src-tauri
        run: cargo check
