<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Modern green gradient: lighter top-left, deeper bottom-right -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"  stop-color="#34d399"/>
      <stop offset="55%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>

    <!-- Soft top highlight to give the bg a glassy depth -->
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0.04"/>
      <stop offset="55%" stop-color="#000000" stop-opacity="0.00"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.18"/>
    </linearGradient>

    <!-- Subtle drop shadow under the pickaxe for lift -->
    <filter id="pickaxe-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="10"/>
      <feOffset dx="0" dy="14" result="off"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.30"/></feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- The pickaxe as a single reusable symbol: head + handle, centered at (0,0).
         Head points up; the curved blade sweeps left, the straight spike points right. -->
    <symbol id="pickaxe" viewBox="-220 -260 440 520">
      <!-- Handle: straight shaft going down from the head. Slightly tapered. -->
      <path d="
        M -22 -40
        L  22 -40
        L  30 230
        L -30 230
        Z" fill="#ffffff"/>
      <!-- Grip: a small rounded pommel at the base of the handle -->
      <rect x="-40" y="214" width="80" height="40" rx="18" fill="#ffffff"/>

      <!-- Head: the characteristic pickaxe shape.
           A curved blade sweeping up-left, a straight spike pointing up-right,
           joined through a thickened eye where the handle passes through. -->
      <path d="
        M 0 -60
        C 60 -120, 140 -150, 215 -180
        C 200 -150, 175 -120, 130 -95
        C 80 -68, 35 -56, 0 -52
        L 0 -60 Z" fill="#ffffff"/>
      <!-- The straight spike (right side) -->
      <path d="
        M 0 -60
        C -40 -120, -90 -160, -150 -200
        C -165 -180, -150 -150, -110 -120
        C -65 -85, -28 -62, 0 -56
        L 0 -60 Z" fill="#ffffff"/>
      <!-- Eye/thickening where head meets handle -->
      <ellipse cx="0" cy="-50" rx="46" ry="34" fill="#ffffff"/>
    </symbol>
  </defs>

  <!-- Rounded-square app-icon background (squircle-ish via rx). -->
  <rect x="0" y="0" width="1024" height="1024" rx="224" ry="224" fill="url(#bg)"/>
  <!-- Sheen overlay, clipped to the rounded square -->
  <rect x="0" y="0" width="1024" height="1024" rx="224" ry="224" fill="url(#sheen)"/>

  <!-- Pickaxe, scaled and placed slightly above optical center. -->
  <g filter="url(#pickaxe-shadow)">
    <use href="#pickaxe" x="220" y="240" width="440" height="520"/>
  </g>
</svg>
