<!DOCTYPE html>
<html dir="rtl" lang="fa">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>کلنگ — ویرایشگر</title>
  <style>
    :root {
      /* Catppuccin Mocha palette */
      --bg: #1e1e2e;
      --surface: #313244;
      --text: #cdd6f4;
      --accent: #cba6f7;
      --success: #a6e3a1;
      --error: #f38ba8;
      --muted: #7f849c;
      --border: #45475a;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: "Vazirmatn", "SF Pro Display", "Segoe UI", Tahoma, system-ui, sans-serif;
      font-size: 14px;
      overflow: hidden;
    }

    #app {
      display: flex;
      flex-direction: row;
      height: 100vh;
    }

    /* ---- Sidebar (explorer) — first flex child → right side in RTL ----
       Collapses to a thin strip (same pattern as the output panel: a thin
       header bar stays visible to re-expand). State persists in
       localStorage 'kolang-sidebar-collapsed' (migrated from the old
       'kolang-sidebar-hidden'). */
    #sidebar {
      width: 240px;
      flex: 0 0 240px;
      background: #181825;
      border-left: 1px solid #313244;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      transition: width 0.15s ease, flex-basis 0.15s ease;
    }

    /* Collapsed: thin strip showing only the chevron — click to re-expand.
       Uses a slightly darker background (#11111b = Mocha Crust) so it reads
       as an intentional rail, not a broken panel. */
    #sidebar.collapsed {
      width: 36px;
      flex: 0 0 36px;
      background: #11111b;
      border-left-color: #11111b;
    }
    #sidebar.collapsed #explorer { display: none; }
    #sidebar.collapsed .sidebar-title { display: none; }
    #sidebar.collapsed .sidebar-actions { display: none; }
    #sidebar.collapsed .sidebar-header {
      justify-content: center;
      padding: 8px 4px;
      border-bottom: none;
      cursor: pointer;
      height: 100%;
    }
    #sidebar.collapsed .sidebar-header:hover { background: #181825; }
    #sidebar.collapsed .sidebar-chevron {
      font-size: 18px;
      padding: 8px 10px;
      color: #cba6f7;
    }
    #sidebar.collapsed .sidebar-chevron:hover {
      color: #cdd6f4;
      background: #313244;
    }

    .sidebar-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 4px;
      padding: 8px 12px;
      border-bottom: 1px solid #313244;
      user-select: none;
    }

    .sidebar-chevron {
      background: transparent;
      border: none;
      color: var(--muted);
      cursor: pointer;
      font-size: 14px;
      padding: 2px 6px;
      border-radius: 4px;
      font-family: inherit;
      line-height: 1;
    }
    .sidebar-chevron:hover { color: var(--text); background: #31324466; }

    .sidebar-actions {
      display: flex;
      gap: 4px;
    }

    .sidebar-title {
      color: #cdd6f4;
      font-weight: bold;
      font-size: 13px;
      flex: 1;
    }

    .btn-small {
      padding: 3px 8px;
      font-size: 13px;
    }

    #explorer {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: 4px 0;
      direction: rtl;
      text-align: right;
      font-size: 13px;
    }

    .tree-item {
      padding: 3px 12px 3px 8px;
      cursor: pointer;
      color: #bac2de;
      font-weight: 500;
      white-space: nowrap;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .tree-item:hover { background: #313244; color: #cdd6f4; }
    .tree-item.active { background: #313244; color: #cba6f7; font-weight: 600; }
    .tree-item.dir { color: #f9e2af; font-weight: 600; }
    .tree-children { padding-right: 16px; }
    .tree-icon { font-size: 14px; opacity: 1; }

    /* ---- Main column (toolbar + editor + output) ---- */
    #main {
      flex: 1;
      min-width: 0;
      min-height: 0; /* critical for flex children to scroll */
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ---- Toolbar ---- */
    #toolbar {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      flex: 0 0 auto;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--bg);
      color: var(--text);
      font-size: 13px;
      font-family: inherit;
      cursor: pointer;
      transition: background 0.15s ease, border-color 0.15s ease;
    }

    .btn:hover { background: #3a3b4e; border-color: var(--muted); }
    .btn:active { transform: translateY(1px); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .btn-run {
      background: var(--success);
      border-color: var(--success);
      color: #1e1e2e;
      font-weight: 600;
    }
    .btn-run:hover { background: #b7e7b3; border-color: #b7e7b3; }

    .btn-stop { background: var(--error); border-color: var(--error); color: #1e1e2e; font-weight: 600; }
    .btn-stop:hover { background: #f5a9c0; border-color: #f5a9c0; }

    .btn-accent { color: var(--accent); }

    .spacer { flex: 1 1 auto; }

    #status {
      color: var(--muted);
      font-size: 12px;
      padding-inline-start: 8px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* LTR/RTL direction toggle — small emoji icon reflecting the active
       tab's effective text direction. ↩️ = RTL, ↪️ = LTR. No `color` is set
       so the emoji renders at its natural (colorful) brightness; a `color`
       property would tint/darken the emoji glyph. */
    #direction-toggle {
      padding: 4px 8px;
      font-size: 16px;
      line-height: 1;
      text-align: center;
    }
    #direction-toggle:hover { background: #313244; }
    #direction-toggle:active { background: #313244; }

    /* ---- Tab bar ---- */
    #tab-bar {
      display: flex;
      align-items: stretch;
      flex: 0 0 auto;
      background: #181825;
      border-bottom: 1px solid var(--border);
      overflow-x: auto;
      overflow-y: hidden;
      min-height: 34px;
      max-height: 34px;
      direction: rtl;
      scrollbar-width: thin;
    }

    .tab {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 0 12px;
      min-width: 120px;
      max-width: 220px;
      border-left: 1px solid var(--border);
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      font-size: 12px;
      white-space: nowrap;
      user-select: none;
    }
    .tab:hover { background: #31324466; color: var(--text); }
    .tab.active {
      background: var(--bg);
      color: var(--text);
      border-top: 2px solid var(--accent);
    }
    .tab-label {
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      direction: rtl;
    }
    .tab-close {
      color: var(--muted);
      font-size: 14px;
      line-height: 1;
      padding: 0 2px;
      border-radius: 3px;
    }
    .tab-close:hover { color: var(--error); background: #45475a66; }

    /* ---- Editor / output split ---- */
    #editor {
      flex: 1;
      min-height: 0; /* CRITICAL for flex children to scroll */
      background: var(--bg);
      overflow: hidden;
    }

    /* Editor font size is driven by the settings (JS sets the CSS variable). */
    .cm-content { font-size: var(--editor-font-size, 14px); }

    /* RTL editor: put the vertical scrollbar on the LEFT. The editor theme
       (kolang-extras.mjs) sets `& { direction: ltr }` so .cm-scroller inherits
       ltr and WebKit/Blink paints the scrollbar on the right, over the Persian
       text. Flipping .cm-scroller to rtl moves the scrollbar to the left.
       .cm-content / .cm-line already carry `direction: rtl` in the theme, so
       the text direction is unaffected. The reversed flex main-axis would
       shove .cm-gutters (order: 2 in the theme) to the left, so we pin them
       back to the right edge with a lower order — scoped under #editor so the
       id-selector specificity beats the theme's class rule. */
    .cm-scroller { direction: rtl; }
    #editor .cm-gutters { order: -1; }

    /* ---- Light theme (Catppuccin Latte) — applied via body.light ----
       The editor surface is themed by kolang-extras.mjs (kolangEditorThemeLight);
       these rules cover the chrome (sidebar, tabs, output, resizer). Colors
       follow the Latte palette: Base #eff1f5, Mantle #e6e9ef, Surface0 #ccd0da,
       Surface1 #bcc0cc, Text #4c4f69, Mauve #8839ef, etc. */
    body.light {
      --bg: #eff1f5;
      --surface: #e6e9ef;
      --text: #4c4f69;
      --accent: #8839ef;
      --success: #40a02b;
      --error: #d20f39;
      --muted: #6c6f85;
      --border: #bcc0cc;
    }
    body.light #sidebar { background: #e6e9ef; border-left-color: var(--border); }
    body.light #sidebar.collapsed { background: #dce0e8; border-left-color: #dce0e8; }
    body.light #sidebar.collapsed .sidebar-chevron { color: #8839ef; }
    body.light #tab-bar { background: #e6e9ef; border-bottom-color: var(--border); }
    body.light #toolbar { background: var(--surface); border-bottom-color: var(--border); }
    body.light .tab { color: #6c6f85; }
    body.light .tab.active { background: var(--bg); color: var(--text); border-top-color: var(--accent); }
    body.light #editor { background: var(--bg); }
    body.light #output, body.light #output-panel { background: #e6e9ef; }
    body.light #output-header { border-bottom-color: var(--border); }
    body.light .output-header-title { color: var(--muted); }
    body.light #output .out { color: var(--text); }
    body.light #output .err { color: var(--error); }
    body.light #output .muted { color: var(--muted); }
    body.light #output::-webkit-scrollbar-track,
    body.light #explorer::-webkit-scrollbar-track { background: #e6e9ef; }
    body.light #output::-webkit-scrollbar-thumb,
    body.light #explorer::-webkit-scrollbar-thumb { background: #bcc0cc; }
    body.light #output-resizer { background: var(--border); }
    body.light #output-resizer::after { background: var(--muted); }
    body.light .tab:hover { background: #ccd0da; }
    body.light .tab-close:hover { background: #bcc0cc; }
    body.light .tree-item { color: #5c5f77; }
    body.light .tree-item:hover { background: #ccd0da; color: #4c4f69; }
    body.light .tree-item.active { background: #ccd0da; color: #8839ef; }
    body.light .tree-item.dir { color: #df8e1d; }
    body.light .btn { background: var(--bg); color: var(--text); border-color: var(--border); }
    body.light .btn:hover { background: #ccd0da; border-color: var(--muted); }
    body.light .btn-accent { color: var(--accent); }
    body.light .modal-content { background: var(--surface); border-color: var(--border); }
    body.light .modal-content h2 { color: var(--text); }
    body.light .modal-content label { color: var(--muted); }
    body.light .path-row input,
    body.light .settings-grid input,
    body.light .settings-grid select {
      background: var(--bg); color: var(--text); border-color: var(--border);
    }
    body.light .shortcuts-table td { border-bottom-color: var(--border); }
    body.light .shortcuts-table kbd { background: #ccd0da; border-color: var(--border); color: var(--text); }

    /* ---- Draggable resize handle between editor and output ---- */
    #output-resizer {
      flex: 0 0 6px;
      height: 6px;
      min-height: 6px;
      background: var(--border);
      cursor: row-resize;
      position: relative;
      transition: background 0.15s ease;
    }
    #output-resizer::after {
      content: "";
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 40px;
      height: 2px;
      border-radius: 1px;
      background: var(--muted);
      opacity: 0.45;
      transition: opacity 0.15s ease;
    }
    #output-resizer:hover { background: var(--muted); }
    #output-resizer:hover::after { opacity: 0.95; }

    /* ---- Collapsible output panel (header + scrollable body) ---- */
    #output-panel {
      flex: 0 0 220px;
      min-height: 0;
      display: flex;
      flex-direction: column;
      background: #181825;
      overflow: hidden;
    }
    /* Collapsed: only the thin header bar stays visible to re-expand. */
    #output-panel.collapsed { flex: 0 0 28px; }
    #output-panel.collapsed #output { display: none; }
    #output-panel.collapsed #output-header { border-bottom: none; }

    #output-header {
      flex: 0 0 28px;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 12px;
      direction: rtl;
      border-bottom: 1px solid var(--border);
      user-select: none;
      cursor: pointer;
    }
    #output-header:hover .output-header-title { color: var(--text); }

    #output-toggle-btn {
      background: transparent;
      border: none;
      color: var(--text);
      cursor: pointer;
      font-size: 13px;
      line-height: 1;
      padding: 2px 6px;
      border-radius: 4px;
      font-family: inherit;
      display: inline-flex;
      align-items: center;
    }
    #output-toggle-btn:hover { color: var(--accent); background: #31324466; }

    .output-header-title {
      color: var(--muted);
      font-size: 12px;
      transition: color 0.15s ease;
    }

    #output {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      background: #181825;
      padding: 10px 12px;
      font-family: "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
      font-size: 13px;
      line-height: 1.6;
      white-space: pre-wrap;
      word-break: break-word;
    }

    /* Scrollbars for output + explorer */
    #output::-webkit-scrollbar, #explorer::-webkit-scrollbar { width: 10px; }
    #output::-webkit-scrollbar-track, #explorer::-webkit-scrollbar-track { background: #181825; }
    #output::-webkit-scrollbar-thumb, #explorer::-webkit-scrollbar-thumb { background: #45475a; border-radius: 5px; }
    #output::-webkit-scrollbar-thumb:hover, #explorer::-webkit-scrollbar-thumb:hover { background: #585b70; }

    #output .out { color: var(--text); }
    #output .err { color: var(--error); }
    #output .muted { color: var(--muted); }

    /* ---- Settings modal ---- */
    .modal {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.55);
      z-index: 1000;
    }

    .modal.hidden { display: none; }

    .modal-content {
      width: 480px;
      max-width: 90vw;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 20px 24px;
    }

    .modal-content h2 {
      font-size: 16px;
      margin-bottom: 14px;
      color: var(--text);
    }

    .modal-content label {
      display: block;
      margin-bottom: 8px;
      color: var(--muted);
      font-size: 13px;
    }

    .path-row {
      display: flex;
      gap: 8px;
      margin-bottom: 18px;
    }

    .path-row input {
      flex: 1 1 auto;
      min-width: 0;
      padding: 8px 10px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      font-family: "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
      font-size: 12px;
      direction: ltr;
      text-align: left;
    }

    .path-row input:focus { outline: none; border-color: var(--accent); }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
    }

    /* ---- Settings grid (VS Code-style editor settings) ---- */
    .settings-grid {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 10px 12px;
      margin: 16px 0;
      align-items: center;
    }
    .settings-grid label { margin-bottom: 0; }
    .settings-grid input[type="number"],
    .settings-grid select {
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 6px 10px;
      font-size: 13px;
      font-family: inherit;
      direction: ltr;
      text-align: left;
    }
    .settings-grid input[type="number"]:focus,
    .settings-grid select:focus { outline: none; border-color: var(--accent); }
    .settings-grid .check-row {
      grid-column: 1 / -1;
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
    }
    .settings-grid .check-row input { accent-color: var(--accent); width: auto; }

    /* ---- Shortcuts modal ---- */
    .shortcuts-list {
      max-height: 50vh;
      overflow-y: auto;
      margin-bottom: 14px;
    }

    .shortcuts-table {
      width: 100%;
      border-collapse: collapse;
      direction: rtl;
    }

    .shortcuts-table td {
      padding: 5px 10px;
      border-bottom: 1px solid #313244;
      text-align: right;
      font-size: 13px;
    }
    .shortcuts-table td:first-child {
      color: var(--text);
    }
    .shortcuts-table td:last-child {
      color: var(--muted);
    }

    .shortcuts-table kbd {
      background: #313244;
      border: 1px solid #45475a;
      border-radius: 4px;
      padding: 2px 6px;
      font-family: "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
      font-size: 12px;
      color: #cdd6f4;
      direction: ltr;
      display: inline-block;
    }
  </style>
</head>
<body>
  <div id="app">
    <div id="sidebar" class="sidebar">
      <div class="sidebar-header" id="sidebar-header">
        <button id="sidebar-chevron" class="sidebar-chevron" title="پنهان/نمایش کاوشگر">▾</button>
        <span class="sidebar-title">کاوشگر</span>
        <div class="sidebar-actions">
          <button id="open-btn" class="btn btn-small" title="باز کردن فایل">📂</button>
          <button id="save-btn" class="btn btn-small" title="ذخیره فایل">💾</button>
          <button id="open-folder-btn" class="btn btn-small" title="باز کردن پوشه">📁</button>
        </div>
      </div>
      <div id="explorer"><span class="muted">یک پوشه باز کنید</span></div>
    </div>

    <div id="main">
      <div id="toolbar">
        <img src="./build/logo.svg" alt="کلنگ" class="toolbar-logo" style="height: 28px; width: 28px; margin-inline-end: 0.5rem;">
        <button id="run-btn" class="btn btn-run" title="اجرا">▶ اجرا</button>
        <button id="stop-btn" class="btn btn-stop" title="توقف" disabled>■ توقف</button>
        <button id="direction-toggle" class="btn btn-small" title="جهت متن">↩️</button>
        <button id="settings-btn" class="btn btn-accent" title="تنظیمات">⚙ تنظیمات</button>
        <button id="shortcuts-btn" class="btn btn-accent" title="میان‌برها">⌨ میان‌برها</button>
        <div class="spacer"></div>
        <span id="status">آماده</span>
      </div>

      <div id="tab-bar"></div>

      <div id="editor"></div>

      <div id="output-resizer" title="تغییر اندازه"></div>

      <div id="output-panel">
        <div id="output-header" title="پنهان/نمایش خروجی">
          <button id="output-toggle-btn" type="button" title="پنهان/نمایش خروجی" aria-label="پنهان/نمایش خروجی"><span id="output-toggle-icon">▾</span></button>
          <span class="output-header-title">خروجی</span>
        </div>
        <div id="output"></div>
      </div>
    </div>

    <div id="settings-modal" class="modal hidden">
      <div class="modal-content">
        <h2>تنظیمات</h2>
        <label>مسیر مفسر کلنگ:</label>
        <div class="path-row">
          <input type="text" id="kolang-path-input" placeholder="/path/to/kolang" />
          <button id="browse-btn" class="btn">...</button>
        </div>
        <label>مسیر لینتر کلنگ:</label>
        <div class="path-row">
          <input type="text" id="linter-path-input" placeholder="/path/to/kolang-linter" />
          <button id="browse-linter-btn" class="btn">...</button>
        </div>

        <div class="settings-grid">
          <label for="font-size-input">اندازه قلم (px):</label>
          <input type="number" id="font-size-input" min="8" max="32" value="14" />

          <label for="tab-size-input">اندازه تب:</label>
          <input type="number" id="tab-size-input" min="1" max="16" value="4" />

          <label for="theme-select">پوسته:</label>
          <select id="theme-select">
            <option value="dark">تیره</option>
            <option value="light">روشن</option>
          </select>

          <label class="check-row"><input type="checkbox" id="auto-theme-checkbox" checked /> تم خودکار (بر اساس سیستم)</label>
          <label class="check-row"><input type="checkbox" id="word-wrap-checkbox" checked /> شکستن خطوط (word wrap)</label>
          <label class="check-row"><input type="checkbox" id="line-numbers-checkbox" checked /> نمایش شماره خط‌ها</label>
          <label class="check-row"><input type="checkbox" id="auto-save-checkbox" /> ذخیره خودکار هنگام تغییر</label>
          <label class="check-row"><input type="checkbox" id="auto-format-checkbox" /> قالب‌بندی خودکار هنگام ذخیره</label>
        </div>

        <div class="modal-actions">
          <button id="settings-reset" class="btn">بازنشانی به پیش‌فرض</button>
        </div>
      </div>
    </div>

    <div id="shortcuts-modal" class="modal hidden">
      <div class="modal-content">
        <h2>میان‌برهای صفحه‌کلید</h2>
        <div id="shortcuts-list" class="shortcuts-list"></div>
        <div class="modal-actions">
          <button id="shortcuts-edit-json" class="btn btn-accent">ویرایش میان‌برها (JSON)</button>
          <button id="shortcuts-close" class="btn">بستن</button>
        </div>
      </div>
    </div>
  </div>

  <!--
    ------------------------------------------------------------------
    CodeMirror 6 bundle. `dist/bundle.js` is produced by `npm run build`
    (build.js / esbuild) from renderer.js + @kolang/grammar + CM6.
