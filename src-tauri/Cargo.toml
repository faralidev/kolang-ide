[package]
name = "kolang-ide"
version = "0.1.2"
edition = "2021"
description = "ویرایشگر دسکتاپ کلنگ — Tauri + CodeMirror"
authors = ["FaraliDev and contributors"]
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["blocking"] }
flate2 = "1"
tar = "0.4"
zip = "2"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
